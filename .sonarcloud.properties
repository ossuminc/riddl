  target/out/jvm/scala-3.9.0-RC1/riddl-lib/scoverage-report/scoverage.xml,\
  target/out/jvm/scala-3.9.0-RC1/riddlc/scoverage-report/scoverage.xml,\
  target/out/jvm/scala-3.9.0-RC1/riddl-utils/scoverage-report/scoverage.xml

# Path to sources
#sonar.sources=.
sonar.exclusions=**/src/test/**
