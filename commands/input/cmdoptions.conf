common {
  show-times = true
  verbose = false
  quiet = false
  debug = true
  dry-run = false
  show-warnings = true
  show-missing-warnings = false
  show-style-warnings = false
}

dump { input-file = "dump.riddl" }
# A REAL file, unlike the neighbouring entries: the standard `check` test only exercises
# option parsing, so a nonexistent path passes there but fails an actual `from ... find` run.
find { input-file = "everything.riddl", expression = "-type entity" }

from { config-file = "file.conf"
  target-command = "dump"
}

onchange {
  config-file = "commands/src/test/input/onchange.riddl"
  watch-directory = "commands/src/test/input"
  target-command = "parse"
  interactive = true
}

parse { input-file = "parse.riddl" }

stats { 
  input-file = "stats.riddl" 
}

validate { input-file = "validate.riddl" }
